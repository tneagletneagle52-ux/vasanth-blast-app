name: Build VASANTH BLAST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Android App
        run: cordova create app com.vasanth.blast "VASANTH BLAST"

      - name: Extract Website
        shell: bash
        run: |
          ZIP_FILE="VASANTH_BLAST_Website_Source-1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p website
          unzip -o "$ZIP_FILE" -d website

          INDEX_FILE="$(find website -type f -name index.html -print -quit)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside ZIP"
            find website -maxdepth 4 -type f
            exit 1
          fi

          WEBSITE_DIR="$(dirname "$INDEX_FILE")"
          mkdir -p app/www
          cp -a "$WEBSITE_DIR"/. app/www/

      - name: Build APK
        run: |
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VASANTH-BLAST-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
