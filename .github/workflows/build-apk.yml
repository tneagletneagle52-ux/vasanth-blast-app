name: Build VASANTH BLAST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Android App
        run: |
          cordova create app com.vasanth.blast "VASANTH BLAST"

      - name: Extract Website
        run: |
          mkdir -p website
          unzip VASANT
